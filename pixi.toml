# Environment of the MOLONARI-hardware repository: cgitsync recomposes its Operating Space from install.cgs.
[workspace]
name = "MOLONARI-hardware"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"  # ComplexGitSync needs 3.11
git = "*"

[pypi-dependencies]
# cgitsync, the tool that recomposes the Operating Space; pixi.lock pins its commit
complexgitsync = { git = "https://github.com/flipoyo/ComplexGitSync.git", branch = "main" }

[tasks]
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
